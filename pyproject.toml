[build-system]
requires = [
    "setuptools>=77.0.3",
    "setuptools-scm>=8",
]
build-backend = "setuptools.build_meta"

[project]
name = "SeInE-orientation"
dynamic = ["version"]
description = "Orientation Selectivity Inference from a Gabor model"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

authors = [
    { name = "Alexander Schmidt" }
]

dependencies = [
    "numpy",
    "scipy",
    "SeInE-HB>=0.1.3",
    "event-estimator>=0.1.1"
]

[project.scripts]
seine-orientation = "seine_orientation.process_session:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["seine_orientation*"]

[tool.setuptools_scm]
version_file = "seine_orientation/_version.py"
local_scheme = "no-local-version"